# Temporaire : produit les PDF d'exemple (en-têtes et pieds de page) et les dépose sur la
# branche « captures/kit-test » pour relecture. À supprimer après validation.
name: Aperçu PDF
on:
  push:
    branches: ['securite/**']
    paths: ['src/utils/**', 'src/lib/__tests__/pdf-branding.test.ts', '.github/workflows/apercu-pdf.yml']
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: PDF d'exemple
        run: |
          npx --yes esbuild src/lib/__tests__/pdf-branding.test.ts --bundle --platform=node --format=esm --define:import.meta.env={} --external:jspdf --outfile=node_modules/.tmp/pdf.mjs --log-level=error
          set -o pipefail
          mkdir -p apercu
          PDF_OUT=$PWD/apercu node node_modules/.tmp/pdf.mjs > apercu/resultat.txt 2>&1 || { cat apercu/resultat.txt; echo "::error::$(grep -v '^ *at ' apercu/resultat.txt | tail -12 | tr '\n' ' ' | cut -c1-1500)"; exit 1; }
          cat apercu/resultat.txt
      - name: Dépôt sur la branche captures/kit-test
        run: |
          cd apercu
          git init -q -b captures/kit-test
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Aperçu PDF ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures/kit-test
