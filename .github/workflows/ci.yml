# Vérifie automatiquement que le projet s'installe, passe la vérification TypeScript et se compile.
name: Vérification

on:
  push:
    branches: [main, 'amelioration/**']
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm install --no-audit --no-fund

      - name: Vérification TypeScript
        id: tsc
        run: |
          set +e
          npm run lint > tsc-report.txt 2>&1
          code=$?
          cat tsc-report.txt
          echo "errors=$(grep -c 'error TS' tsc-report.txt)" >> "$GITHUB_OUTPUT"
          exit $code
        continue-on-error: true

      - name: Rapport TypeScript lisible (onglet Checks)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          errors="${{ steps.tsc.outputs.errors }}"
          conclusion=success; [ "${errors:-0}" != "0" ] && conclusion=failure
          jq -n --arg sha "$GITHUB_SHA" --arg c "$conclusion" --arg n "${errors:-0}" \
                --rawfile text tsc-report.txt \
            '{name: "Rapport TypeScript", head_sha: $sha, status: "completed", conclusion: $c,
              output: {title: ($n + " erreur(s) TypeScript"), summary: ($n + " erreur(s)"), text: ($text | .[0:60000])}}' \
          | gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - > /dev/null

      - name: Compilation (mode production)
        run: npm run build
        env:
          VITE_DEMO_MODE: 'false'

      - name: Compilation (mode démo)
        run: npm run build

      - name: Échec si erreurs TypeScript
        if: steps.tsc.outcome == 'failure'
        run: exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construction de l'image Docker
        run: docker build -t rhema-business .

      - name: Vérification du fichier docker-compose
        run: docker compose config -q

      - name: Démarrage et contrôle du site
        run: |
          docker run -d -p 8080:80 --name rhema rhema-business
          sleep 3
          docker exec rhema nginx -t
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          headers=$(curl -fsSI http://localhost:8080/)
          echo "$headers"
          for h in X-Frame-Options Content-Security-Policy X-Content-Type-Options Cache-Control; do
            echo "$headers" | grep -qi "^$h:" || { echo "En-tête manquant : $h"; exit 1; }
          done
          asset=$(curl -fsS http://localhost:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          curl -fsSI "http://localhost:8080$asset" | grep -qi 'immutable'
          echo "Site servi correctement avec les en-têtes de sécurité."

  serveur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests de l'API (stockage en mémoire)
        run: |
          DB_DRIVER=memory SETUP_CODE=ci-memoire PORT=8090 node server/index.mjs &
          sleep 2
          BASE_URL=http://localhost:8090 SETUP_CODE=ci-memoire node server/tests/api.test.mjs

      - name: Démarrage de la pile complète (application + MariaDB)
        env:
          DB_PASSWORD: ci-base-${{ github.run_id }}
          DB_ROOT_PASSWORD: ci-root-${{ github.run_id }}
          SETUP_CODE: ci-installation
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then echo "Serveur prêt"; break; fi
            sleep 3
          done
          docker compose ps
          curl -fsS http://localhost:8080/api/health

      - name: Tests de l'API sur MariaDB
        run: BASE_URL=http://localhost:8080 SETUP_CODE=ci-installation node server/tests/api.test.mjs

      - name: Les données survivent au redémarrage
        env:
          DB_PASSWORD: ci-base-${{ github.run_id }}
          DB_ROOT_PASSWORD: ci-root-${{ github.run_id }}
          SETUP_CODE: ci-installation
        run: |
          docker compose restart
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:8080/api/public/status | grep -q '"initialized":true'
          echo "Base conservée après redémarrage."

      - name: Refus des mots de passe d'exemple
        run: |
          set +e
          docker run --rm -e DB_PASSWORD=CHANGEZ_MOI -e SETUP_CODE=x rhema-business-serveur:latest
          test $? -eq 1 && echo "Démarrage refusé comme prévu."

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color | tail -200
